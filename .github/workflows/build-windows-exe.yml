name: Build Windows exe

# 手动触发，也可以每次推送到 main 分支时自动打包
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe with PyInstaller
        # --onefile: 打成单个 exe，方便拷贝
        # --windowed: 图形界面程序，不弹黑窗口
        # --name MiniAssistant: 生成的文件名，改成你自己的程序名
        run: |
          pyinstaller --onefile --windowed --name MiniAssistant main.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: MiniAssistant-windows
          path: dist/MiniAssistant.exe
          retention-days: 30
